<script>
const REPO = "https://huggingface.co/datasets/ai-music/ai-music-deduplicated/";
const SOURCES = ["suno", "udio", "riffusion", "mureka", "sonauto"];
const CHUNK = 4 * 1024 * 1024;          // скільки читаємо за раз, шукаючи початок наступного треку в tar
const LIKES_KEY = "genmus.likes.v2";
const CACHE_DB = "genmus", CACHE_STORE = "tracks", CACHE_VER = 1, CACHE_MAX = 5000;
const $ = id => document.getElementById(id);
const audio = $("audio");
const dec = new TextDecoder();
const trackKey = t => t.path + "#" + t.pos;

// ---------- IndexedDB: усі вже зчитані JSON-метадані (для повторного семантичного пошуку без HF) ----------
let cacheDb = null;
function openCache() {
  if (cacheDb) return Promise.resolve(cacheDb);
  return new Promise((resolve, reject) => {
    const r = indexedDB.open(CACHE_DB, CACHE_VER);
    r.onupgradeneeded = () => r.result.createObjectStore(CACHE_STORE, { keyPath: "key" });
    r.onsuccess = () => resolve(cacheDb = r.result);
    r.onerror = () => reject(r.error);
  });
}
function cacheRecord(t) {
  // без blob/raw — лише те, що треба для відтворення й embedding
  const { path, source, pos, size, ext, title, tags, vocals, style, text, haystack, emb } = t;
  return { key: trackKey(t), path, source, pos, size, ext, title, tags, vocals, style, text, haystack, emb: emb || null, at: Date.now() };
}
async function cachePut(list) {
  if (!list?.length) return;
  try {
    const db = await openCache();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(CACHE_STORE, "readwrite");
      const st = tx.objectStore(CACHE_STORE);
      for (const t of list) st.put(cacheRecord(t));
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
    const n = await new Promise((resolve, reject) => {
      const r = db.transaction(CACHE_STORE, "readonly").objectStore(CACHE_STORE).count();
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => reject(r.error);
    });
    if (n <= CACHE_MAX) return;
    const all = await cacheList();
    const drop = all.sort((a, b) => (a.at || 0) - (b.at || 0)).slice(0, all.length - CACHE_MAX);
    await new Promise((resolve, reject) => {
      const tx = db.transaction(CACHE_STORE, "readwrite");
      const st = tx.objectStore(CACHE_STORE);
      for (const t of drop) st.delete(t.key);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  } catch (e) { console.warn("track cache:", e); }
}
async function cacheList() {
  try {
    const db = await openCache();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(CACHE_STORE, "readonly");
      const r = tx.objectStore(CACHE_STORE).getAll();
      r.onsuccess = () => resolve(r.result || []);
      r.onerror = () => reject(r.error);
    });
  } catch (e) { console.warn("track cache:", e); return []; }
}

// ---------- i18n (English by default, switchable) ----------
const I = {

    aiLoading: p => `🧠 Loading the semantic search model… ${p}% (one time, ~118 MB)`,
    aiReady: "🧠 Semantic search: looks for meaning, in any language", aiFailed: "Semantic model unavailable — searching by exact words",
    prev: "⏮ Back", like: "♡ Like", liked: "♥ Saved", dl: "⬇ Save", next: "Next ⏭",
    sub: "Every track made by AI. Press next. Keep what you love.",
    saved: "Saved ❤", savedEmpty: "Nothing yet — like something.",
    found: (n, m) => `Found: ${n} · scanned ${m}`, searchingLi: "Searching…",
    waiting: m => `Waiting for the first match… scanned ${m}`,
    searching: "Looking for a track…", loading: "Loading track…",
    error: "Loading failed. Press “Next”.",
    track: (src, v, fb, hint, pct) => `${src} · ${v === true ? "🎤 with vocals" : v === false ? "🎹 instrumental" : "vocals: unknown"}` + (pct != null ? ` · ${pct}% match` : "") + (fb ? " · from already known (search continues)" : "") + (hint ? " · press ▶" : ""),
    noTitle: "Untitled", limit: "Close to the Hugging Face rate limit — short pause",
    metaTitle: "Search description (JSON)", metaCopy: "Copy", metaEmpty: "No track yet",
    metaLoading: "Loading JSON…", metaErr: "Could not load metadata",
  },
  uk: {
    all: "Усі", vocal: "🎤 Зі словами", instr: "🎹 Без слів",
    ph: "Опиши настрій, жанр чи тему + Enter",
    sim: "≈ Схожі", simTo: x => `≈ Схожі на «${x}»`,
    examples: ["сумна пісня про дощ", "епічна музика для бою", "щось для тренування", "нічна поїздка, синтвейв", "лагідна колискова", "пісня про кохання українською"],
    aiLoading: p => `🧠 Завантажую модель смислового пошуку… ${p}% (один раз, ~118 МБ)`,
    aiReady: "🧠 Смисловий пошук: шукає за змістом, будь-якою мовою", aiFailed: "Модель недоступна — шукаю за точними словами",
    prev: "⏮ Назад", like: "♡ Лайк", liked: "♥ Збережено", dl: "⬇ Зберегти", next: "Далі ⏭",
    sub: "Кожен трек створений ШІ. Тисни «Далі». Лишай, що сподобалось.",

    waiting: m => `Чекаю на перший збіг… переглянуто ${m}`,
    searching: "Шукаю трек…", loading: "Завантажую трек…",
    error: "Помилка завантаження. Натисни «Далі».",
    track: (src, v, fb, hint, pct) => `${src} · ${v === true ? "🎤 зі словами" : v === false ? "🎹 без слів" : "слова: невідомо"}` + (pct != null ? ` · збіг ${pct}%` : "") + (fb ? " · з уже відомих (новий пошук триває)" : "") + (hint ? " · натисни ▶" : ""),
    noTitle: "Без назви", limit: "Близько до ліміту Hugging Face — коротка пауза",
    metaTitle: "Опис для пошуку (JSON)", metaCopy: "Копіювати", metaEmpty: "Ще немає треку",
    metaLoading: "Завантажую JSON…", metaErr: "Не вдалося прочитати метадані",
  },
};
const LANG_KEY = "genmus.lang";
// мова: збережений вибір користувача → мова браузера (uk → UA) → англійська
const pref = (navigator.languages || [navigator.language]).map(l => String(l).slice(0, 2).toLowerCase()).find(l => I[l]);
let lang = pref || "en";
try { const l = localStorage.getItem(LANG_KEY); if (I[l]) lang = l; } catch {}
const t = (k, ...a) => { const v = I[lang][k]; return typeof v === "function" ? v(...a) : v; };
let statusArgs = null;
function setStatus(...a) { statusArgs = a; $("status").textContent = a.length ? t(...a) : ""; }
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(e => e.textContent = t(e.dataset.i18n));
  document.querySelectorAll("[data-i18n-ph]").forEach(e => e.placeholder = t(e.dataset.i18nPh));
  document.querySelectorAll("#lang button").forEach(b => b.classList.toggle("on", b.dataset.l === lang));
  if (statusArgs) $("status").textContent = t(...statusArgs);
  if (aiState) $("ai").textContent = t(...aiState);
  renderChips(); renderQueue(); render(); updateLike();
}

let mode = "all", current = null, token = 0, objUrl = null;

const loadLikes = () => { try { return JSON.parse(localStorage.getItem(LIKES_KEY)) || [] } catch { return [] } };
const saveLikes = v => { try { localStorage.setItem(LIKES_KEY, JSON.stringify(v)) } catch {} };

// ---------- читання tar-файлів датасету через Range-запити ----------
// Офіційний ліміт HF для анонімів: 3000 resolve-запитів / 5 хв на IP (фіксоване вікно).
// Тримаємо власну стелю 2400 / 5 хв (~80%), щоб не ловити 429; якщо все ж прилетить 429 — спільна пауза.
const BUDGET = 2400, WINDOW = 300_000;
const stamps = [];
let pausedUntil = 0;
async function throttle() {
  for (;;) {
    const now = Date.now();
    while (stamps.length && stamps[0] < now - WINDOW) stamps.shift();
    const wait = Math.max(pausedUntil - now, stamps.length >= BUDGET ? stamps[0] + WINDOW - now : 0);
    if (wait <= 0) { stamps.push(now); return; }
    $("found").title = t("limit");
    await new Promise(r => setTimeout(r, Math.min(wait, 2000)));
  }
}
async function range(path, a, b) {
  for (let attempt = 0; attempt < 4; attempt++) {
    await throttle();
    const r = await fetch(REPO + "resolve/main/" + path, { headers: { Range: `bytes=${a}-${b}` } });
    if (r.status === 429) { pausedUntil = Date.now() + 20_000 * (attempt + 1); continue; }
    if (!r.ok && r.status !== 206) throw new Error("HTTP " + r.status);
    return new Uint8Array(await r.arrayBuffer());
  }
  throw new Error("rate limited");
}

let filesCache = null, filesPending = null;
async function listFiles() {
  if (filesCache) return filesCache;
  // один спільний запит: інакше 16 воркерів одночасно б'ють tree API
  if (!filesPending) {
    filesPending = Promise.all(SOURCES.map(async s => {
      const r = await fetch(`https://huggingface.co/api/datasets/ai-music/ai-music-deduplicated/tree/main/${s}`);
      return (await r.json()).filter(f => f.path.endsWith(".tar")).map(f => ({ path: f.path, size: f.size, source: s }));
    })).then(parts => (filesCache = parts.flat()))
      .finally(() => { filesPending = null; });
  }
  return filesPending;
}

async function pickFile(sources) {
  const files = (await listFiles()).filter(f => sources.includes(f.source));
  let x = Math.random() * files.reduce((s, f) => s + f.size, 0);
  for (const f of files) { if ((x -= f.size) < 0) return f; }
  return files[files.length - 1];
}

const oct = (b, a, z) => parseInt(dec.decode(b.subarray(a, z)).replace(/\0.*$/, "").trim() || "0", 8);
const name = (b, i) => dec.decode(b.subarray(i, i + 100)).replace(/\0.*$/, "");
const isUstar = (b, i) => b[i+257]===117 && b[i+258]===115 && b[i+259]===116 && b[i+260]===97 && b[i+261]===114;

// з випадкового місця у tar шукаємо заголовок найближчого аудіофайлу
async function findAudio(file) {
  let pos = Math.floor(Math.random() * Math.max(1, (file.size - 2 * CHUNK) / 512)) * 512;
  for (let k = 0; k < 4 && pos < file.size; k++, pos += CHUNK) {
    const buf = await range(file.path, pos, Math.min(pos + CHUNK, file.size) - 1);
    for (let i = 0; i + 512 <= buf.length; i += 512) {
      if (!isUstar(buf, i)) continue;
      const n = name(buf, i);
      const m = n.match(/\.(mp3|m4a|ogg)$/);
      if (m) return { path: file.path, source: file.source, pos: pos + i, size: oct(buf, i + 124, i + 136), ext: m[1] };
    }
  }
  return null;
}

// після аудіо в tar іде json з метаданими, а за ним — заголовок наступного треку (між ними може бути PaxHeader)
async function readMetaAndNext(t) {
  const start = t.pos + 512 + Math.ceil(t.size / 512) * 512;
  let want = 24 * 1024;
  for (let attempt = 0; attempt < 3; attempt++) {
    const buf = await range(t.path, start, start + want - 1);
    let o = 0, meta = null, next = null, grow = false;
    while (o + 512 <= buf.length) {
      const n = name(buf, o), sz = oct(buf, o + 124, o + 136);
      if (!n) break;
      if (n.endsWith(".json")) {
        if (o + 512 + sz > buf.length) { want = o + 512 + sz + 2048; grow = true; break; }
        try { meta = JSON.parse(dec.decode(buf.subarray(o + 512, o + 512 + sz))); } catch { meta = {}; }
      } else {
        const m = n.match(/\.(mp3|m4a|ogg)$/);
        if (m) { next = { path: t.path, source: t.source, pos: start + o, size: sz, ext: m[1] }; break; }
      }
      o += 512 + Math.ceil(sz / 512) * 512;
    }
    if (!grow) return { meta: meta || {}, next };
  }
  return { meta: {}, next: null };
}

// ---------- нормалізація метаданих різних платформ ----------
const asList = v => Array.isArray(v) ? v : (typeof v === "string" ? v.split(",") : []);
const hasLyrics = txt => {
  const t = String(txt || "").replace(/\[[^\]]*\]/g, "").replace(/\(.*?\)/g, "").trim();
  return t.length > 0;
};
function normalize(m, source) {
  let tags = [], lyrics = null, vocals = null;
  if (source === "suno") {
    const md = m.metadata || {};
    tags = asList(md.tags); lyrics = md.prompt || "";
    vocals = hasLyrics(lyrics);
  } else if (source === "udio") {
    tags = asList(m.tags); lyrics = m.lyrics || "";
    vocals = hasLyrics(lyrics);
  } else if (source === "riffusion") {
    tags = asList(m.sound); lyrics = m.lyrics || "";
    vocals = hasLyrics(lyrics);
  } else if (source === "sonauto") {
    tags = asList(m.tags);
    if (tags.some(t => /instrumental/i.test(t))) vocals = false;
    else if (m.lyrics_id) vocals = true;
  } else if (source === "mureka") {
    tags = [...asList(m.genres), ...asList(m.moods)];
  }
  tags = tags.map(s => String(s).trim()).filter(Boolean);
  const title = (m.title || t("noTitle")).trim();
  // для моделі окремо: стиль (жанр/теги/опис) і текст (назва + початок слів без службових [Verse]/[Chorus])
  const words = String(lyrics || "").replace(/\[[^\]]*\]/g, " ").replace(/\s+/g, " ").trim().slice(0, 300);
  const style = [tags.join(", "), m.description || ""].filter(Boolean).join(". ");
  const text = [title, words].filter(Boolean).join(". ");
  return { title, tags, vocals, style, text, haystack: [title, tags.join(" "), lyrics || "", m.description || ""].join(" ").toLowerCase() };
}

// ---------- смисловий (semantic) пошук ----------
// Багатомовна embedding-модель прямо в браузері (transformers.js, ONNX/WASM): запит і опис треку
// перетворюються на вектори, схожість = косинус. Українські запити знаходять англійські теги й навпаки.
const MODEL = "Xenova/paraphrase-multilingual-MiniLM-L12-v2";
const MIN_SIM = 0.3;      // нижче цього — вже не про те (основний відбір — відносний, див. TOP_SHARE)
const SOFT_MIN = 0.2;     // м'якша підлога, поки черга порожня після довгого скану
const SOFT_AFTER = 100;   // після стількох переглядів без збігів — допускаємо SOFT_MIN
const STYLE_W = 0.7;      // жанр/теги важать більше, ніж назва й текст пісні
const TOP_SHARE = 0.2;    // і серед переглянутих беремо лише найкращі ~20%
const MIN_SCAN = 120;     // при смисловому пошуку не зупиняємось на перших збігах — є з чого вибрати найкращі

const MODEL_WORKER = `

const files = {};
let p;
try {
  p = await pipeline("feature-extraction", ${JSON.stringify(MODEL)}, {
    dtype: "q8",
    progress_callback: x => {
      if (x.status !== "progress" || !x.total) return;
      files[x.file] = [x.loaded, x.total];
      const [l, tot] = Object.values(files).reduce((a, [u, v]) => [a[0] + u, a[1] + v], [0, 0]);
      postMessage({ type: "progress", pct: Math.floor(100 * l / tot) });

  try { postMessage({ type: "result", id: data.id, vecs: (await p(data.texts, { pooling: "mean", normalize: true })).tolist() }); }

    catch (e) { return fail(e); }

      if (d.type === "progress") setAi("aiLoading", d.pct);

// Один запит до моделі за раз. Запит користувача йде поза чергою; завдання застарілого пошуку (інший gen) відкидаються
const jobs = [];

const styleOf = n => n.style ?? (n.tags || []).join(", ");
const textOf = n => n.text ?? n.title;

async function embedPairs(list, g, urgent) {

  const v = await embed(texts, g, urgent);

// Окремі теги: у довгому списку («mysterious, ambient, soft, film score, …») одне слово розчиняється при усередненні,
// тож запит «space ambient» порівнюємо ще й з кожним тегом. Теги дуже повторюються — вектори кешуємо.

    const v = await embedPairs(chunk, g);
    if (!v) return;

// стиль зі стилем, текст із текстом; якщо однієї частини нема — рахуємо за іншою.

// ---------- вибір треку ----------
// одне випадкове місце в tar → кілька сусідніх треків з метаданими (дешево: по одному маленькому запиту на трек)
const RUN = 5;
async function probeRun(sources) {
  const out = [];

  for (let i = 0; i < RUN && t; i++) {
    let r;
    try { r = await readMetaAndNext(t); } catch { break; }
    out.push({ ...t, ...normalize(r.meta, t.source), raw: r.meta });

// ---------- фонова черга: пошук іде, поки немає що грати ----------
// Браузер тримає ~6 з'єднань на хост — більше воркерів лише створює pending і гальмує перший scanned.
// Probe і embed розведені: Range-скан не чекає на модель — лічильник scanned росте одразу.
// Без запиту — режим радіо: знайшли трек → стоп. Смисловий: добираємо вибірку, потім теж стоп.
const WORKERS_MAX = 6, WORKERS_MIN = 1;

  const fill = Math.min(1, n / KEEP);

function resetQueue(similar) {

async function rankCached(g) {
  const list = await cacheList();
  if (!list.length || g !== gen) return;
  for (const t of list) {
    if (pool.some(x => same(x, t))) continue;
    pool.push(t);
    if (pool.length > 300) pool.shift();
  }
  const N = 40;
  for (let i = 0; i < list.length; i += N) {
    if (g !== gen) return;
    await rankBatch(list.slice(i, i + N), g);

function admit(t, s) {

  // якщо топ повний — пускаємо лише кращих за найгірший (інакше кеш із тисяч треків не витіснить слабкі збіги)

  queue.push({ ...t, score: s });
  queue.sort((a, b) => (b.score ?? 0) - (a.score ?? 0));

// оцінка батчу окремо від probe: ключові слова — одразу; смисловий скоринг — у слоті моделі

      if (g !== gen) return;
      if (!passesMode(t) || !keywordHit(t)) continue;
      admit(t, 1);

    renderQueue();
  }

  if (g !== gen) return;
  if (qvec) await withEmbedSlot(() => embedTracks(list, g).catch(() => {}));

    const s = relevance(t);
    if (s === null) continue;
    if (qvec) seen.push(s);
    admit(t, s);

async function worker(g, id) {
  // легке розведення старту, щоб не бити HF одним залпом
  if (id) await sleep(id * 80);
  while (g === gen) {
    const { slots, delay } = pace();
    if (id >= slots) { await sleep(delay || 400); continue; }   // ситі / зайві — сплять, не probe
    // турбо лише поки ще голодні й мало збігів
    if (delay && !(scanned < MIN_SCAN && queue.length < 3 && hungry())) await sleep(delay);
    if (!hungry()) { await sleep(400); continue; }
    const list = await probeRun(curSources).catch(() => []);
    if (g !== gen) return;
    if (!list.length) continue;
    // scanned росте одразу після Range-проби — не після embed
    scanned += list.length;

// під час текстового/«схожі» пошуку — лише релевантні; інакше можна взяти будь-який відомий
function fallbackTrack(onlyFit) {
  const known = [...loadLikes(), ...history, ...pool].filter(x => !(current && same(x, current)) && !(simTo && same(x, simTo)));

  const min = qvec ? MIN_SIM : 1;
  const fit = known.map(x => ({ ...x, score: relevance(x) })).filter(x => x.score !== null && x.score >= min)

  if (onlyFit) return fit.length ? fit[Math.floor(Math.random() * fit.length)] : null;

  return src[Math.floor(Math.random() * src.length)];

async function takeNext(my) {
  const searching = () => !!(curTerm || simTo);
  while (my === token) {
    if (queue.length) { const t = queue.shift(); renderQueue(); return t; }
    // активний пошук: лише релевантні з відомих; інакше будь-який відомий
    const f = fallbackTrack(searching());
    if (f) { fallbackUsed = true; return f; }
    // не стартуємо окремий probe — він конкурує з воркерами і дає трек без scanned++
    setStatus(searching() ? "waiting" : "searching", ...(searching() ? [scanned] : []));
    await sleep(250);
  }
  return undefined;
}

// ---------- відтворення ----------
const MIME = { mp3: "audio/mpeg", m4a: "audio/mp4", ogg: "audio/ogg" };

const HIST_KEY = "genmus.history";
let history = [];   // вже програні треки (без аудіо), щоб можна було повернутися назад; переживає перезавантаження
try { history = JSON.parse(localStorage.getItem(HIST_KEY)) || []; } catch {}
function saveHistory() { try { localStorage.setItem(HIST_KEY, JSON.stringify(history)) } catch {} }
function updatePrev() { saveHistory(); }

async function show(t, my, back) {
  setStatus("loading");
  const bytes = await range(t.path, t.pos + 512, t.pos + 511 + t.size);
  if (my !== token) return;
  const blob = new Blob([bytes], { type: MIME[t.ext] });
  if (objUrl) URL.revokeObjectURL(objUrl);
  objUrl = URL.createObjectURL(blob);
  if (current && !back) { const { blob: _b, emb: _e, score: _s, raw: _r, ...meta } = current; history.push(meta); if (history.length > 50) history.shift(); }
  current = { ...t, blob };
  updatePrev();
  audio.src = objUrl;
  $("title").textContent = t.title;
  $("tags").textContent = t.tags.slice(0, 6).join(" · ");
  const sa = ["track", t.source, t.vocals, fallbackUsed];
  setStatus(...sa, false, pctOf(t));
  fallbackUsed = false;
  updateLike();
  audio.play().catch(() => setStatus(...sa, true, pctOf(t)));
}

async function next(fixed, back) {
  const my = ++token;
  $("disc").classList.remove("spin");
  setStatus("searching");
  try {
    const t = fixed || await takeNext(my);
    if (my !== token || t === undefined) return;
    await show(t, my, back);
  } catch (e) {
    if (my === token) setStatus("error");
  }
}

const same = (a, b) => a.path === b.path && a.pos === b.pos;

}

  const likes = loadLikes(), ul = $("list");

  likes.forEach(x => {
    const li = document.createElement("li");
    li.innerHTML = `<span></span><button>▶</button><button>✕</button>`;
    li.firstChild.textContent = x.title;
    const [p, d] = li.querySelectorAll("button");
    p.onclick = () => next(x);
    d.onclick = () => { saveLikes(loadLikes().filter(y => !same(y, x))); render(); updateLike(); };

$("like").onclick = () => {
  if (!current) return;
  const likes = loadLikes(), i = likes.findIndex(x => same(x, current));
  if (i >= 0) likes.splice(i, 1);
  else { const { path, source, pos, size, ext, title, tags, vocals } = current; likes.unshift({ path, source, pos, size, ext, title, tags, vocals }); }

// ---------- перегляд JSON-опису, по якому шукаємо ----------
function searchDesc(t) {

    title: t.title,
    tags: t.tags,
    vocals: t.vocals,
    score: t.score ?? null,

}

// ---------- збереження файлу ----------
$("dl").onclick = () => {

  a.download = current.title.replace(/[^\p{L}\p{N} _-]+/gu, "").trim().slice(0, 80) + "." + current.ext;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

// ---------- керування ----------
$("seg").onclick = e => {
  const m = e.target.dataset.m; if (!m) return;
  mode = m;
  document.querySelectorAll("#seg button").forEach(b => b.classList.toggle("on", b.dataset.m === m));
  resetQueue(); next();
};
// дебаунс: після паузи в наборі (коротший, коли ще нічого не знайдено); Enter — одразу
const DEBOUNCE = 400, DEBOUNCE_EMPTY = 150;
$("q").oninput = () => {
  clearTimeout(qTimer);
  const ms = queue.length ? DEBOUNCE : DEBOUNCE_EMPTY;
  qTimer = setTimeout(() => {
    if (simTo || $("q").value.trim().toLowerCase() !== curTerm) { resetQueue(); next(); }
  }, ms);
};
$("q").onkeydown = e => {
  if (e.key !== "Enter") return;
  clearTimeout(qTimer);
  resetQueue(); next();
};
$("q").onfocus = () => loadModel();
$("sim").onclick = () => { if (current) { resetQueue(current); next(); } };
$("next").onclick = () => next();
// як у звичайних плеєрах: якщо трек грає вже кілька секунд або історія порожня — починаємо його спочатку, інакше йдемо до попереднього
$("lang").onclick = e => {
  const l = e.target.dataset.l; if (!l || l === lang) return;
  lang = l; try { localStorage.setItem(LANG_KEY, l) } catch {}
  applyLang();
};
$("prev").onclick = () => {
  if (history.length && !(current && audio.currentTime > 3)) { next(history.pop(), true); updatePrev(); }
  else if (current) { audio.currentTime = 0; audio.play().catch(() => {}); }
};
audio.onplay = () => $("disc").classList.add("spin");
audio.onpause = () => $("disc").classList.remove("spin");
audio.onended = () => next();

// ---------- гучність ----------
const VOL_KEY = "genmus.volume";
function setVol(v) {
  audio.volume = v; $("vol").value = v;
  $("volIcon").textContent = v == 0 ? "🔇" : v < 0.4 ? "🔉" : "🔊";
  try { localStorage.setItem(VOL_KEY, v) } catch {}
}
$("vol").oninput = () => setVol(+$("vol").value);
$("volIcon").onclick = () => setVol(audio.volume > 0 ? 0 : 0.8);
let v0 = 0.8; try { v0 = parseFloat(localStorage.getItem(VOL_KEY)); if (isNaN(v0)) v0 = 0.8 } catch {}
setVol(v0);

applyLang();
loadModel();   // тягнемо модель одразу — перший смисловий пошук не стоїть на завантаженні
resetQueue();
next();
</script>
</body>
