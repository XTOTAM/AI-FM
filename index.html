<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI FM</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0f1020; --card:#1a1b33; --fg:#f1f1f8; --mut:#8a8ca8; --acc:#ff4d8d; --chip:#2b2c4d }
  * { box-sizing:border-box }
  body { position:relative; margin:0; background:var(--bg); color:var(--fg); font-family:"Montserrat",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
         min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:24px 16px }
  h1 { font-weight:800; margin:8px 0 6px; letter-spacing:.5px }
  .lang { position:absolute; top:16px; right:16px; display:flex; background:var(--chip); border-radius:999px; padding:2px }
  .lang button { background:none; padding:6px 12px; font-size:11px }
  .lang button.on { background:var(--acc) }
  .sub { color:var(--mut); font-size:13px; margin:0 0 20px; text-align:center }
  .card { background:var(--card); border-radius:20px; padding:24px; width:100%; max-width:440px; text-align:center }
  .seg { display:flex; background:var(--chip); border-radius:999px; padding:3px; margin-bottom:12px }
  .seg button { flex:1; background:none; padding:9px 6px; font-size:12px }
  .seg button.on { background:var(--acc) }
  #q { width:100%; padding:11px 16px; border-radius:999px; border:0; background:var(--chip); color:var(--fg); font:inherit; font-size:13px; outline:none; margin-bottom:20px }
  #q:focus { box-shadow:0 0 0 2px var(--acc) }
  #q { margin-bottom:8px }
  .chips { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-bottom:8px }
  .chips button { padding:5px 10px; font-size:11px; font-weight:400; color:var(--mut) }
  .chips button:hover { color:var(--fg) }
  #ai { color:var(--mut); font-size:11px; min-height:14px; margin-bottom:14px }
  .pct { color:var(--acc); font-size:11px; font-weight:600; flex:none !important }
  .disc { width:110px; height:110px; border-radius:50%; margin:0 auto 16px; background:conic-gradient(#ff4d8d,#7a4dff,#4dd2ff,#ff4d8d) }
  .disc.spin { animation:spin 4s linear infinite }
  @keyframes spin { to { transform:rotate(360deg) } }
  #title { font-weight:600; margin:0 0 4px; font-size:16px; word-break:break-word }
  #tags { color:var(--mut); font-size:12px; margin-bottom:6px; word-break:break-word }
  #status { color:var(--mut); font-size:12px; min-height:16px; margin-bottom:12px }
  audio { width:100%; margin-bottom:16px }
  .vol { display:flex; align-items:center; gap:10px; margin-bottom:16px }
  .vol input { flex:1; accent-color:var(--acc) }
  .row { display:flex; gap:8px; justify-content:center; flex-wrap:wrap }
  button { font:inherit; font-weight:600; border:0; border-radius:999px; padding:11px 18px; cursor:pointer; color:var(--fg); background:var(--chip) }
  button:hover { filter:brightness(1.2) }
  button:disabled { opacity:.5; cursor:default }
  #like.on { background:var(--acc) }
  h2 { font-size:15px; margin:28px 0 10px; color:var(--mut); font-weight:600 }
  .lst, #list { width:100%; max-width:440px; list-style:none; padding:0; margin:0 }
  .lst li, #list li { background:var(--card); border-radius:12px; padding:10px 14px; margin-bottom:8px; display:flex; align-items:center; gap:10px; font-size:13px }
  .lst li span, #list li span { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .lst button, #list button { padding:6px 12px; font-size:12px }
  .empty { color:var(--mut) }
</style>
</head>
<body>
  <div class="lang" id="lang"><button data-l="en" class="on">EN</button><button data-l="uk">UA</button></div>
  <h1>🎧 AI FM</h1>
  <p class="sub" data-i18n="sub"></p>
  <div class="card">
    <div class="seg" id="seg">
      <button data-m="all" class="on" data-i18n="all"></button>
      <button data-m="vocal" data-i18n="vocal"></button>
      <button data-m="instr" data-i18n="instr"></button>
    </div>
    <input id="q" type="search" data-i18n-ph="ph">
    <div class="chips" id="chips"></div>
    <div id="ai"></div>

    <div class="disc" id="disc"></div>
    <p id="title">—</p>
    <div id="tags"></div>
    <div id="status"></div>
    <audio id="audio" controls></audio>
    <div class="vol"><span id="volIcon">🔊</span><input id="vol" type="range" min="0" max="1" step="0.01" value="0.8"></div>
    <div class="row">
      <button id="prev" data-i18n="prev"></button>
      <button id="like"></button>
      <button id="dl" data-i18n="dl"></button>
      <button id="sim" data-i18n="sim"></button>
      <button id="next" data-i18n="next"></button>
    </div>
  </div>

  <h2 id="found"></h2>
  <ul id="queue" class="lst"></ul>

  <h2 data-i18n="saved"></h2>
  <ul id="list"></ul>

<script>
const REPO = "https://huggingface.co/datasets/ai-music/ai-music-deduplicated/";
const SOURCES = ["suno", "udio", "riffusion", "mureka", "sonauto"];
const CHUNK = 4 * 1024 * 1024;          // скільки читаємо за раз, шукаючи початок наступного треку в tar
const LIKES_KEY = "genmus.likes.v2";
const $ = id => document.getElementById(id);
const audio = $("audio");
const dec = new TextDecoder();

// ---------- i18n (English by default, switchable) ----------
const I = {
  en: {
    all: "All", vocal: "🎤 With vocals", instr: "🎹 Instrumental",
    ph: "Describe a vibe, mood or theme + Enter",
    sim: "≈ Similar", simTo: x => `≈ Similar to “${x}”`,
    examples: ["rainy night lo-fi", "epic battle music", "sad song about lost love", "music for a workout", "dreamy synthwave drive", "lullaby"],
    aiLoading: p => `🧠 Loading the semantic search model… ${p}% (one time, ~118 MB)`,
    aiReady: "🧠 Semantic search: looks for meaning, in any language", aiFailed: "Semantic model unavailable — searching by exact words",
    prev: "⏮ Back", like: "♡ Like", liked: "♥ Saved", dl: "⬇ Save", next: "Next ⏭",
    sub: "Every track made by AI. Press next. Keep what you love.",
    saved: "Saved ❤", savedEmpty: "Nothing yet — like something.",
    found: (n, m) => `Found: ${n} · scanned ${m}`, searchingLi: "Searching…",
    waiting: m => `Waiting for the first match… scanned ${m}`,
    searching: "Looking for a track…", loading: "Loading track…",
    error: "Loading failed. Press “Next”.",
    track: (src, v, fb, hint, pct) => `${src} · ${v === true ? "🎤 with vocals" : v === false ? "🎹 instrumental" : "vocals: unknown"}` + (pct != null ? ` · ${pct}% match` : "") + (fb ? " · from already known (search continues)" : "") + (hint ? " · press ▶" : ""),
    noTitle: "Untitled", limit: "Close to the Hugging Face rate limit — short pause",
  },
  uk: {
    all: "Усі", vocal: "🎤 Зі словами", instr: "🎹 Без слів",
    ph: "Опиши настрій, жанр чи тему + Enter",
    sim: "≈ Схожі", simTo: x => `≈ Схожі на «${x}»`,
    examples: ["сумна пісня про дощ", "епічна музика для бою", "щось для тренування", "нічна поїздка, синтвейв", "лагідна колискова", "пісня про кохання українською"],
    aiLoading: p => `🧠 Завантажую модель смислового пошуку… ${p}% (один раз, ~118 МБ)`,
    aiReady: "🧠 Смисловий пошук: шукає за змістом, будь-якою мовою", aiFailed: "Модель недоступна — шукаю за точними словами",
    prev: "⏮ Назад", like: "♡ Лайк", liked: "♥ Збережено", dl: "⬇ Зберегти", next: "Далі ⏭",
    sub: "Кожен трек створений ШІ. Тисни «Далі». Лишай, що сподобалось.",
    saved: "Збережене ❤", savedEmpty: "Поки порожньо — лайкни щось.",
    found: (n, m) => `Знайдено: ${n} · переглянуто ${m}`, searchingLi: "Шукаю…",
    waiting: m => `Чекаю на перший збіг… переглянуто ${m}`,
    searching: "Шукаю трек…", loading: "Завантажую трек…",
    error: "Помилка завантаження. Натисни «Далі».",
    track: (src, v, fb, hint, pct) => `${src} · ${v === true ? "🎤 зі словами" : v === false ? "🎹 без слів" : "слова: невідомо"}` + (pct != null ? ` · збіг ${pct}%` : "") + (fb ? " · з уже відомих (новий пошук триває)" : "") + (hint ? " · натисни ▶" : ""),
    noTitle: "Без назви", limit: "Близько до ліміту Hugging Face — коротка пауза",
  },
};
const LANG_KEY = "genmus.lang";
// мова: збережений вибір користувача → мова браузера (uk → UA) → англійська
const pref = (navigator.languages || [navigator.language]).map(l => String(l).slice(0, 2).toLowerCase()).find(l => I[l]);
let lang = pref || "en";
try { const l = localStorage.getItem(LANG_KEY); if (I[l]) lang = l; } catch {}
const t = (k, ...a) => { const v = I[lang][k]; return typeof v === "function" ? v(...a) : v; };
let statusArgs = null;
function setStatus(...a) { statusArgs = a; $("status").textContent = a.length ? t(...a) : ""; }
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(e => e.textContent = t(e.dataset.i18n));
  document.querySelectorAll("[data-i18n-ph]").forEach(e => e.placeholder = t(e.dataset.i18nPh));
  document.querySelectorAll("#lang button").forEach(b => b.classList.toggle("on", b.dataset.l === lang));
  if (statusArgs) $("status").textContent = t(...statusArgs);
  if (aiState) $("ai").textContent = t(...aiState);
  renderChips(); renderQueue(); render(); updateLike();
}

let mode = "all", current = null, token = 0, objUrl = null;

const loadLikes = () => { try { return JSON.parse(localStorage.getItem(LIKES_KEY)) || [] } catch { return [] } };
const saveLikes = v => { try { localStorage.setItem(LIKES_KEY, JSON.stringify(v)) } catch {} };

// ---------- читання tar-файлів датасету через Range-запити ----------
// Офіційний ліміт HF для анонімів: 3000 resolve-запитів / 5 хв на IP (фіксоване вікно).
// Тримаємо власну стелю 2400 / 5 хв (~80%), щоб не ловити 429; якщо все ж прилетить 429 — спільна пауза.
const BUDGET = 2400, WINDOW = 300_000;
const stamps = [];
let pausedUntil = 0;
async function throttle() {
  for (;;) {
    const now = Date.now();
    while (stamps.length && stamps[0] < now - WINDOW) stamps.shift();
    const wait = Math.max(pausedUntil - now, stamps.length >= BUDGET ? stamps[0] + WINDOW - now : 0);
    if (wait <= 0) { stamps.push(now); return; }
    $("found").title = t("limit");
    await new Promise(r => setTimeout(r, Math.min(wait, 2000)));
  }
}
async function range(path, a, b) {
  for (let attempt = 0; attempt < 4; attempt++) {
    await throttle();
    const r = await fetch(REPO + "resolve/main/" + path, { headers: { Range: `bytes=${a}-${b}` } });
    if (r.status === 429) { pausedUntil = Date.now() + 20_000 * (attempt + 1); continue; }
    if (!r.ok && r.status !== 206) throw new Error("HTTP " + r.status);
    return new Uint8Array(await r.arrayBuffer());
  }
  throw new Error("rate limited");
}

let filesCache = null;
async function listFiles() {
  if (filesCache) return filesCache;
  const parts = await Promise.all(SOURCES.map(async s => {
    const r = await fetch(`https://huggingface.co/api/datasets/ai-music/ai-music-deduplicated/tree/main/${s}`);
    return (await r.json()).filter(f => f.path.endsWith(".tar")).map(f => ({ path: f.path, size: f.size, source: s }));
  }));
  return (filesCache = parts.flat());
}

async function pickFile(sources) {
  const files = (await listFiles()).filter(f => sources.includes(f.source));
  let x = Math.random() * files.reduce((s, f) => s + f.size, 0);
  for (const f of files) { if ((x -= f.size) < 0) return f; }
  return files[files.length - 1];
}

const oct = (b, a, z) => parseInt(dec.decode(b.subarray(a, z)).replace(/\0.*$/, "").trim() || "0", 8);
const name = (b, i) => dec.decode(b.subarray(i, i + 100)).replace(/\0.*$/, "");
const isUstar = (b, i) => b[i+257]===117 && b[i+258]===115 && b[i+259]===116 && b[i+260]===97 && b[i+261]===114;

// з випадкового місця у tar шукаємо заголовок найближчого аудіофайлу
async function findAudio(file) {
  let pos = Math.floor(Math.random() * Math.max(1, (file.size - 2 * CHUNK) / 512)) * 512;
  for (let k = 0; k < 4 && pos < file.size; k++, pos += CHUNK) {
    const buf = await range(file.path, pos, Math.min(pos + CHUNK, file.size) - 1);
    for (let i = 0; i + 512 <= buf.length; i += 512) {
      if (!isUstar(buf, i)) continue;
      const n = name(buf, i);
      const m = n.match(/\.(mp3|m4a|ogg)$/);
      if (m) return { path: file.path, source: file.source, pos: pos + i, size: oct(buf, i + 124, i + 136), ext: m[1] };
    }
  }
  return null;
}

// після аудіо в tar іде json з метаданими, а за ним — заголовок наступного треку (між ними може бути PaxHeader)
async function readMetaAndNext(t) {
  const start = t.pos + 512 + Math.ceil(t.size / 512) * 512;
  let want = 24 * 1024;
  for (let attempt = 0; attempt < 3; attempt++) {
    const buf = await range(t.path, start, start + want - 1);
    let o = 0, meta = null, next = null, grow = false;
    while (o + 512 <= buf.length) {
      const n = name(buf, o), sz = oct(buf, o + 124, o + 136);
      if (!n) break;
      if (n.endsWith(".json")) {
        if (o + 512 + sz > buf.length) { want = o + 512 + sz + 2048; grow = true; break; }
        try { meta = JSON.parse(dec.decode(buf.subarray(o + 512, o + 512 + sz))); } catch { meta = {}; }
      } else {
        const m = n.match(/\.(mp3|m4a|ogg)$/);
        if (m) { next = { path: t.path, source: t.source, pos: start + o, size: sz, ext: m[1] }; break; }
      }
      o += 512 + Math.ceil(sz / 512) * 512;
    }
    if (!grow) return { meta: meta || {}, next };
  }
  return { meta: {}, next: null };
}

// ---------- нормалізація метаданих різних платформ ----------
const asList = v => Array.isArray(v) ? v : (typeof v === "string" ? v.split(",") : []);
const hasLyrics = txt => {
  const t = String(txt || "").replace(/\[[^\]]*\]/g, "").replace(/\(.*?\)/g, "").trim();
  return t.length > 0;
};
function normalize(m, source) {
  let tags = [], lyrics = null, vocals = null;
  if (source === "suno") {
    const md = m.metadata || {};
    tags = asList(md.tags); lyrics = md.prompt || "";
    vocals = hasLyrics(lyrics);
  } else if (source === "udio") {
    tags = asList(m.tags); lyrics = m.lyrics || "";
    vocals = hasLyrics(lyrics);
  } else if (source === "riffusion") {
    tags = asList(m.sound); lyrics = m.lyrics || "";
    vocals = hasLyrics(lyrics);
  } else if (source === "sonauto") {
    tags = asList(m.tags);
    if (tags.some(t => /instrumental/i.test(t))) vocals = false;
    else if (m.lyrics_id) vocals = true;
  } else if (source === "mureka") {
    tags = [...asList(m.genres), ...asList(m.moods)];
  }
  tags = tags.map(s => String(s).trim()).filter(Boolean);
  const title = (m.title || t("noTitle")).trim();
  // для моделі окремо: стиль (жанр/теги/опис) і текст (назва + початок слів без службових [Verse]/[Chorus])
  const words = String(lyrics || "").replace(/\[[^\]]*\]/g, " ").replace(/\s+/g, " ").trim().slice(0, 300);
  const style = [tags.join(", "), m.description || ""].filter(Boolean).join(". ");
  const text = [title, words].filter(Boolean).join(". ");
  return { title, tags, vocals, style, text, haystack: [title, tags.join(" "), lyrics || "", m.description || ""].join(" ").toLowerCase() };
}

// ---------- смисловий (semantic) пошук ----------
// Багатомовна embedding-модель прямо в браузері (transformers.js, ONNX/WASM): запит і опис треку
// перетворюються на вектори, схожість = косинус. Українські запити знаходять англійські теги й навпаки.
const MODEL = "Xenova/paraphrase-multilingual-MiniLM-L12-v2";
const MIN_SIM = 0.4;      // нижче цього — вже не про те
const STYLE_W = 0.7;      // жанр/теги важать більше, ніж назва й текст пісні
const TOP_SHARE = 0.2;    // і серед переглянутих беремо лише найкращі ~20%
const MIN_SCAN = 120;     // при смисловому пошуку не зупиняємось на перших збігах — є з чого вибрати найкращі
const KEEP = 15;          // скільки найкращих кандидатів тримаємо в черзі
let embedder = null, aiState = null;
function setAi(...a) { aiState = a.length ? a : null; $("ai").textContent = a.length ? t(...a) : ""; }
// Модель крутиться у Web Worker, щоб WASM-обчислення не вішали інтерфейс під час набору запиту
const MODEL_WORKER = `
import { pipeline } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.0";
const files = {};
let p;
try {
  p = await pipeline("feature-extraction", ${JSON.stringify(MODEL)}, {
    dtype: "q8",
    progress_callback: x => {
      if (x.status !== "progress" || !x.total) return;
      files[x.file] = [x.loaded, x.total];
      const [l, tot] = Object.values(files).reduce((a, [u, v]) => [a[0] + u, a[1] + v], [0, 0]);
      postMessage({ type: "progress", pct: Math.floor(100 * l / tot) });
    },
  });
  postMessage({ type: "ready" });
} catch (e) { postMessage({ type: "failed", error: String(e) }); }
onmessage = async ({ data }) => {
  try { postMessage({ type: "result", id: data.id, vecs: (await p(data.texts, { pooling: "mean", normalize: true })).tolist() }); }
  catch (e) { postMessage({ type: "result", id: data.id, vecs: null }); }
};`;
const calls = new Map();
let callId = 0;
function loadModel() {
  if (embedder) return embedder;
  setAi("aiLoading", 0);
  embedder = new Promise(resolve => {
    const fail = e => { console.warn("semantic model:", e); setAi("aiFailed"); resolve(null); };
    let w;
    try { w = new Worker(URL.createObjectURL(new Blob([MODEL_WORKER], { type: "text/javascript" })), { type: "module" }); }
    catch (e) { return fail(e); }
    w.onerror = e => fail(e.message || e);
    w.onmessage = ({ data: d }) => {
      if (d.type === "progress") setAi("aiLoading", d.pct);
      else if (d.type === "ready") { setAi("aiReady"); resolve(w); }
      else if (d.type === "failed") fail(d.error);
      else if (d.type === "result") { calls.get(d.id)?.(d.vecs); calls.delete(d.id); }
    };
  });
  return embedder;
}
// Один запит до моделі за раз. Запит користувача йде поза чергою; завдання застарілого пошуку (інший gen) відкидаються
const jobs = [];
let pumping = false;
function embed(texts, g, urgent) {
  return new Promise(res => {
    const j = { texts, g, res };
    urgent ? jobs.unshift(j) : jobs.push(j);
    pump();
  });
}
async function pump() {
  if (pumping) return;
  pumping = true;
  try {
    const w = await loadModel();
    while (jobs.length) {
      const j = jobs.shift();
      if (!w || j.g !== gen) { j.res(null); continue; }
      const id = ++callId;
      j.res(await new Promise(r => { calls.set(id, r); w.postMessage({ id, texts: j.texts }); }));
    }
  } finally { pumping = false; }
}
const styleOf = n => n.style ?? (n.tags || []).join(", ");
const textOf = n => n.text ?? n.title;
// два вектори на трек: { s: стиль (null, якщо тегів нема), t: назва + текст }
async function embedPairs(list, g, urgent) {
  const texts = list.flatMap(n => [styleOf(n), textOf(n)].filter(Boolean));
  const v = await embed(texts, g, urgent);
  if (!v) return null;
  let i = 0;
  return list.map(n => ({ s: styleOf(n) ? v[i++] : null, t: textOf(n) ? v[i++] : null }));
}
async function embedTracks(list, g) {
  const need = list.filter(x => !x.emb);
  if (!need.length) return;
  const v = await embedPairs(need, g);
  if (v) need.forEach((x, i) => x.emb = v[i]);
}
// стиль зі стилем, текст із текстом; якщо однієї частини нема — рахуємо за іншою
function sim(q, e) {
  const s = q.s && e.s ? dot(q.s, e.s) : null, t = q.t && e.t ? dot(q.t, e.t) : null;
  return s === null ? (t ?? 0) : t === null ? s : STYLE_W * s + (1 - STYLE_W) * t;
}
const dot = (a, b) => { let s = 0; for (let i = 0; i < a.length; i++) s += a[i] * b[i]; return s; };

const passesMode = n => !(mode === "vocal" && n.vocals !== true) && !(mode === "instr" && n.vocals !== false);
const keywordHit = n => !!curTerm && curTerm.split(/\s+/).every(w => (n.haystack || n.title.toLowerCase()).includes(w));
// релевантність: null — не підходить; без запиту — 1
function relevance(n) {
  if (!passesMode(n)) return null;
  if (!curTerm && !simTo) return 1;
  if (qvec && n.emb) return sim(qvec, n.emb) + (keywordHit(n) ? 0.1 : 0);   // точний збіг слів — невеликий бонус
  if (qvec || !curTerm) return null;     // вектора треку ще нема / «схожі» без моделі
  return keywordHit(n) ? 1 : null;       // модель недоступна — старий пошук за словами
}
// поріг адаптивний: не нижче MIN_SIM і не гірше за топ-20% усього переглянутого в цьому пошуку
function threshold() {
  if (!qvec) return 1;
  if (seen.length < 20) return MIN_SIM;
  const s = [...seen].sort((a, b) => b - a);
  return Math.max(MIN_SIM, s[Math.floor(s.length * TOP_SHARE)]);
}
const pctOf = n => qvec && n.score != null ? Math.round(Math.min(1, n.score) * 100) : null;

// ---------- вибір треку ----------
// одне випадкове місце в tar → кілька сусідніх треків з метаданими (дешево: по одному маленькому запиту на трек)
const RUN = 5;
async function probeRun(sources) {
  const out = [];
  let t = await findAudio(await pickFile(sources));
  for (let i = 0; i < RUN && t; i++) {
    let r;
    try { r = await readMetaAndNext(t); } catch { break; }
    out.push({ ...t, ...normalize(r.meta, t.source) });
    t = r.next;
  }
  return out;
}

// ---------- фонова черга: пошук іде постійно, знайдене складається в чергу ----------
const WORKERS = 6;
let fallbackUsed = false, queue = [], gen = 0, scanned = 0, curTerm = "", curSources = SOURCES;
let simTo = null, qvec = null, qReady = Promise.resolve(), seen = [];
let qTimer = 0;
const pool = [];   // усі переглянуті треки (навіть ті, що не підійшли під фільтр) — запасний варіант для «Далі»
const sleep = ms => new Promise(r => setTimeout(r, ms));

function resetQueue(similar) {
  clearTimeout(qTimer);
  const g = ++gen; queue = []; scanned = 0; seen = []; qvec = null;
  simTo = similar || null;
  if (simTo) $("q").value = "";
  curTerm = $("q").value.trim().toLowerCase();
  // вектор запиту: текст із поля або сам трек («Схожі»)
  qReady = !curTerm && !simTo ? Promise.resolve()
    : simTo && simTo.emb ? Promise.resolve(qvec = simTo.emb)
    : (simTo ? embedPairs([simTo], g, true).then(v => v && v[0])
       : embed([curTerm], g, true).then(v => v && { s: v[0], t: v[0] }))   // текстовий запит порівнюємо і зі стилем, і з текстом
      .then(q => { if (g === gen && q) qvec = q; }).catch(() => {});
  // у Mureka немає ні текстів, ні ознаки «інструментал» — їх пропускаємо при фільтрі
  curSources = mode !== "all" ? SOURCES.filter(s => s !== "mureka") : SOURCES;
  renderQueue();
  for (let i = 0; i < WORKERS; i++) worker(gen);
}

async function worker(g) {
  const target = 5;
  while (g === gen) {
    if (queue.length >= target && !(qvec && scanned < MIN_SCAN)) { await sleep(500); continue; }
    const list = await probeRun(curSources).catch(() => []);
    await qReady;
    if (qvec) await embedTracks(list, g).catch(() => {});
    if (g !== gen) return;
    let thr = threshold();
    for (const t of list) {
      scanned++;
      pool.push(t); if (pool.length > 300) pool.shift();
      const s = relevance(t);
      if (s === null) continue;
      if (qvec) seen.push(s);
      if (s < thr || queue.some(x => same(x, t)) || (current && same(current, t)) || (simTo && same(simTo, t))) continue;
      queue.push({ ...t, score: s });
    }
    if (qvec) { queue.sort((a, b) => b.score - a.score); queue.length = Math.min(queue.length, KEEP); }   // найкращі збіги — першими
    renderQueue();
  }
}

// якщо черга порожня — не чекаємо, а граємо будь-який відомий трек (лайки, історія, переглянуте), перевагу мають ті, що підходять під фільтр
function fallbackTrack(onlyFit) {
  const known = [...loadLikes(), ...history, ...pool].filter(x => !(current && same(x, current)) && !(simTo && same(x, simTo)));
  if (!known.length) return null;
  // з уже відомих — найближчі за змістом (випадково з п'яти найкращих)
  const fit = known.map(x => ({ ...x, score: relevance(x) })).filter(x => x.score !== null && x.score >= (qvec ? MIN_SIM : 1))
    .sort((a, b) => b.score - a.score).slice(0, 5);
  if (onlyFit && !fit.length) return null;
  const src = fit.length ? fit : known;
  return src[Math.floor(Math.random() * src.length)];
}

async function takeNext(my) {
  while (my === token) {
    if (queue.length) { const t = queue.shift(); renderQueue(); return t; }
    // черга порожня — «Далі» не чекає на пошук: найближчий з відомих, інакше будь-який відомий, інакше свіжий випадковий
    const f = fallbackTrack(false);
    if (f) { fallbackUsed = true; return f; }
    const [r] = await probeRun(SOURCES).catch(() => []);
    if (my !== token) return undefined;
    if (r) { fallbackUsed = true; return r; }
    setStatus("waiting", scanned);
    await sleep(300);
  }
  return undefined;
}

function renderChips() {
  const box = $("chips");
  box.innerHTML = "";
  t("examples").forEach(x => {
    const b = document.createElement("button");
    b.textContent = x;
    b.onclick = () => { $("q").value = x; resetQueue(); next(); };
    box.appendChild(b);
  });
}

function renderQueue() {
  $("found").textContent = (simTo ? t("simTo", simTo.title) + " · " : "") + t("found", queue.length, scanned);
  const ul = $("queue");
  ul.innerHTML = queue.length ? "" : `<li class="empty">${t("searchingLi")}</li>`;
  queue.forEach(t => {
    const li = document.createElement("li");
    const pct = pctOf(t);
    li.innerHTML = `<span></span>${pct != null ? `<span class="pct">${pct}%</span>` : ""}<button>▶</button>`;
    li.firstChild.textContent = t.title + (t.tags.length ? " — " + t.tags.slice(0, 2).join(", ") : "");
    li.title = t.tags.join(", ");
    li.querySelector("button").onclick = () => { queue = queue.filter(x => x !== t); renderQueue(); next(t); };
    ul.appendChild(li);
  });
}

// ---------- відтворення ----------
const MIME = { mp3: "audio/mpeg", m4a: "audio/mp4", ogg: "audio/ogg" };

const HIST_KEY = "genmus.history";
let history = [];   // вже програні треки (без аудіо), щоб можна було повернутися назад; переживає перезавантаження
try { history = JSON.parse(localStorage.getItem(HIST_KEY)) || []; } catch {}
function saveHistory() { try { localStorage.setItem(HIST_KEY, JSON.stringify(history)) } catch {} }
function updatePrev() { saveHistory(); }

async function show(t, my, back) {
  setStatus("loading");
  const bytes = await range(t.path, t.pos + 512, t.pos + 511 + t.size);
  if (my !== token) return;
  const blob = new Blob([bytes], { type: MIME[t.ext] });
  if (objUrl) URL.revokeObjectURL(objUrl);
  objUrl = URL.createObjectURL(blob);
  if (current && !back) { const { blob: _b, emb: _e, score: _s, ...meta } = current; history.push(meta); if (history.length > 50) history.shift(); }
  current = { ...t, blob };
  updatePrev();
  audio.src = objUrl;
  $("title").textContent = t.title;
  $("tags").textContent = t.tags.slice(0, 6).join(" · ");
  const sa = ["track", t.source, t.vocals, fallbackUsed];
  setStatus(...sa, false, pctOf(t));
  fallbackUsed = false;
  updateLike();
  audio.play().catch(() => setStatus(...sa, true, pctOf(t)));
}

async function next(fixed, back) {
  const my = ++token;
  $("disc").classList.remove("spin");
  setStatus("searching");
  try {
    const t = fixed || await takeNext(my);
    if (my !== token || t === undefined) return;
    await show(t, my, back);
  } catch (e) {
    if (my === token) setStatus("error");
  }
}

// ---------- лайки ----------
const same = (a, b) => a.path === b.path && a.pos === b.pos;
function updateLike() {
  const on = current && loadLikes().some(x => same(x, current));
  $("like").classList.toggle("on", !!on);
  $("like").textContent = on ? t("liked") : t("like");
}
function render() {
  const likes = loadLikes(), ul = $("list");
  ul.innerHTML = likes.length ? "" : `<li class="empty">${t("savedEmpty")}</li>`;
  likes.forEach(x => {
    const li = document.createElement("li");
    li.innerHTML = `<span></span><button>▶</button><button>✕</button>`;
    li.firstChild.textContent = x.title;
    const [p, d] = li.querySelectorAll("button");
    p.onclick = () => next(x);
    d.onclick = () => { saveLikes(loadLikes().filter(y => !same(y, x))); render(); updateLike(); };
    ul.appendChild(li);
  });
}
$("like").onclick = () => {
  if (!current) return;
  const likes = loadLikes(), i = likes.findIndex(x => same(x, current));
  if (i >= 0) likes.splice(i, 1);
  else { const { path, source, pos, size, ext, title, tags, vocals } = current; likes.unshift({ path, source, pos, size, ext, title, tags, vocals }); }
  saveLikes(likes); render(); updateLike();
};

// ---------- збереження файлу ----------
$("dl").onclick = () => {
  if (!current) return;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(current.blob);
  a.download = current.title.replace(/[^\p{L}\p{N} _-]+/gu, "").trim().slice(0, 80) + "." + current.ext;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

// ---------- керування ----------
$("seg").onclick = e => {
  const m = e.target.dataset.m; if (!m) return;
  mode = m;
  document.querySelectorAll("#seg button").forEach(b => b.classList.toggle("on", b.dataset.m === m));
  resetQueue(); next();
};
// дебаунс: пошук стартує, коли людина на мить перестала друкувати; Enter — одразу
const DEBOUNCE = 600;
$("q").oninput = () => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { if (simTo || $("q").value.trim().toLowerCase() !== curTerm) { resetQueue(); next(); } }, DEBOUNCE);
};
$("q").onkeydown = e => { if (e.key === "Enter") { resetQueue(); next(); } };
$("q").onfocus = () => loadModel();   // модель важка — починаємо тягнути, щойно людина збирається шукати
$("sim").onclick = () => { if (current) { resetQueue(current); next(); } };
$("next").onclick = () => next();
// як у звичайних плеєрах: якщо трек грає вже кілька секунд або історія порожня — починаємо його спочатку, інакше йдемо до попереднього
$("lang").onclick = e => {
  const l = e.target.dataset.l; if (!l || l === lang) return;
  lang = l; try { localStorage.setItem(LANG_KEY, l) } catch {}
  applyLang();
};
$("prev").onclick = () => {
  if (history.length && !(current && audio.currentTime > 3)) { next(history.pop(), true); updatePrev(); }
  else if (current) { audio.currentTime = 0; audio.play().catch(() => {}); }
};
audio.onplay = () => $("disc").classList.add("spin");
audio.onpause = () => $("disc").classList.remove("spin");
audio.onended = () => next();

// ---------- гучність ----------
const VOL_KEY = "genmus.volume";
function setVol(v) {
  audio.volume = v; $("vol").value = v;
  $("volIcon").textContent = v == 0 ? "🔇" : v < 0.4 ? "🔉" : "🔊";
  try { localStorage.setItem(VOL_KEY, v) } catch {}
}
$("vol").oninput = () => setVol(+$("vol").value);
$("volIcon").onclick = () => setVol(audio.volume > 0 ? 0 : 0.8);
let v0 = 0.8; try { v0 = parseFloat(localStorage.getItem(VOL_KEY)); if (isNaN(v0)) v0 = 0.8 } catch {}
setVol(v0);

applyLang();
resetQueue();
next();
</script>
</body>
